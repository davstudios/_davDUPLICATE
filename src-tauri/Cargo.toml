[package]
name = "davduplicate"
version = "26.10.2"
description = "_davDUPLICATE — local exact duplicate file finder by _davstudios."
authors = ["_davstudios"]
license = "MIT"
homepage = "https://davstudios.it"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "davduplicate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
blake3 = "1"
same-file = "1"
trash = "5"

